<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的日常">
<meta name="theme-color" content="#e8f5f8">
<title>我的日常</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" id="favIcon" href="">
<style>
:root{
  --bg:#e8f5f8;--card:#ffffff;--ink:#1f3a4d;--sub:#6a8999;--line:#d0e6ed;
  --accent:#1f8ea8;--accent2:#bfe6ee;--ok:#3fb8a0;--shadow:0 4px 16px rgba(31,100,130,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c2030;--card:#133149;--ink:#e4f3f7;--sub:#8fb0c0;--line:#1f4561;--accent:#3fb4cc;--accent2:#1a4a62;--shadow:0 4px 16px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.hello{font-size:13px;color:var(--sub)}
.title{font-size:26px;font-weight:700;margin:2px 0}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.datebar{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.datebar .d{cursor:pointer;flex:1;text-align:center;font-weight:600;background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.datebar .d small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.datebar button.n{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.today-btn{font-size:12px;color:var(--accent);margin-bottom:10px;display:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.prog{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.prog b{font-size:17px}.prog span{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.quote{background:linear-gradient(135deg,var(--accent2),var(--card));position:relative;overflow:hidden}
.quote .q{font-size:17px;line-height:1.75;min-height:56px;letter-spacing:.5px}
.quote .tag{font-size:12px;color:var(--sub);margin-bottom:6px}
.quote .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;background:var(--card);font-size:13px;box-shadow:var(--shadow)}
.pill.main{background:var(--accent);color:#fff}
.draw-anim{animation:pop .5s ease}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:none}}
.sec{font-size:13px;color:var(--sub);margin:4px 4px 8px}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border-left:5px solid var(--cc,var(--accent))}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;color:transparent;font-size:14px;background:transparent}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.item.done .tt{text-decoration:line-through;color:var(--sub)}
.body{flex:1;min-width:0}
.tm{font-size:12px;color:var(--sub)}
.tt{font-size:16px;font-weight:600;word-break:break-word}
.nt{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.badge{font-size:11px;color:var(--sub);margin-left:6px}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 8px 22px rgba(31,142,168,.5);z-index:5}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.mask.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:18px}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
input[type=text],input[type=time],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.cats,.days{display:flex;gap:8px;flex-wrap:wrap}
.cats button,.days button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--bg)}
.cats button.on,.days button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;padding:13px;border-radius:14px;font-weight:600;background:var(--bg)}
.acts .pri{background:var(--accent);color:#fff}
.acts .del{color:#d9534f}
.set-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.set-row button{flex:1;min-width:130px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.rt{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rt .x{margin-left:auto;color:#d9534f}
.fav{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6;display:flex;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal-head button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .w{font-size:12px;color:var(--sub);padding:6px 0}
.cal-grid button{aspect-ratio:1;border-radius:12px;font-size:15px;position:relative;background:transparent}
.cal-grid button.today{border:1.5px solid var(--accent)}
.cal-grid button.sel{background:var(--accent);color:#fff}
.cal-grid button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.cal-grid button.sel.has::after{background:#fff}
body{position:relative}
.wrap{position:relative;z-index:1}
.sea{position:absolute;top:0;left:0;right:0;height:170px;background:linear-gradient(180deg,var(--accent2),transparent);overflow:hidden;z-index:0;pointer-events:none}
.sea .waves{position:absolute;left:0;bottom:0;width:100%;height:60px}
.sea .fish{position:absolute;right:56px;top:14px;width:92px;animation:bob 4s ease-in-out infinite}
.sea .fish2{position:absolute;right:24px;top:84px;width:46px;opacity:.7;animation:bob 5s ease-in-out infinite reverse}
.sea .bub{position:absolute;border-radius:50%;border:1.5px solid var(--accent);opacity:.4}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.banner{display:flex;justify-content:flex-end;margin:-4px -4px 0 0}
.banner svg{width:230px;height:auto;display:block;animation:bob 5s ease-in-out infinite}
.qdeco{position:absolute;right:10px;bottom:6px;width:54px;opacity:.5;pointer-events:none}
.qdeco2{position:absolute;right:62px;top:8px;width:22px;opacity:.35;pointer-events:none}
.empty svg{width:200px;opacity:.85;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
</style>
</head>
<body>
<div class="sea" aria-hidden="true">
  <svg class="waves" viewBox="0 0 560 60" preserveAspectRatio="none"><path d="M0 30 C70 5 140 55 210 30 S350 5 420 30 S520 50 560 30 V60 H0Z" fill="var(--accent)" opacity=".18"/><path d="M0 42 C80 22 150 62 230 42 S370 22 440 42 S530 57 560 42 V60 H0Z" fill="var(--accent)" opacity=".28"/></svg>

  <span class="bub" style="width:8px;height:8px;right:160px;top:30px"></span>
</div>
<div class="wrap">
  <div class="banner" aria-hidden="true"><svg viewBox="0 0 270 130">
<g class="manta">
<path d="M10 24Q40 10 82 20L78 58Q60 66 34 62Q16 60 10 24Z" fill="#e8d59c" stroke="#2b3441" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M18 30Q44 20 74 28L71 54Q54 59 36 56Q22 54 18 30Z" fill="#fffbee" stroke="none"/>

<g class="ws" transform="rotate(-12 140 82)">
<path d="M70 80C70 60 100 54 130 54L200 58 238 34 232 70 246 100 200 80 130 90C100 96 70 98 70 80Z" fill="#7391b3" stroke="#2b3441" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76 88C100 98 140 98 200 82" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
<path d="M130 54L148 36 160 57Z" fill="#7391b3" stroke="#2b3441" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M118 88L140 114 150 90Z" fill="#7391b3" stroke="#2b3441" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<g fill="#2b3441"><circle cx="100" cy="68" r="2.6"/><circle cx="118" cy="74" r="2.2"/><circle cx="136" cy="66" r="2.6"/><circle cx="154" cy="72" r="2.2"/><circle cx="172" cy="66" r="2.4"/><circle cx="190" cy="68" r="2"/><circle cx="108" cy="83" r="2"/><circle cx="144" cy="82" r="2.2"/><circle cx="214" cy="60" r="1.8"/></g>
<circle cx="84" cy="74" r="2" fill="#2b3441"/><path d="M74 84Q84 90 98 88" fill="none" stroke="#2b3441" stroke-width="2" stroke-linecap="round"/>
</g></svg></div>
  <div class="top">
    <div>
      <div class="hello" id="hello"></div>
      <div class="title" id="title">我的日常</div>
    </div>
    <button class="iconbtn" id="btnSet" aria-label="設定">⚙️</button>
  </div>

  <div class="datebar">
    <button class="n" id="prev">‹</button>
    <div class="d" id="dateLabel"></div>
    <button class="n" id="next">›</button>
  </div>
  <button class="today-btn" id="toToday">↩ 回到今天</button>

  <div class="card prog">
    <svg class="ring" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle id="ringFg" cx="32" cy="32" r="26" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .5s"/>
      <text id="ringTxt" x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">0%</text>
    </svg>
    <div><b id="progMain">今天還沒有行程</b><span id="progSub">點右下角 ＋ 新增</span></div>
  </div>

  <div class="card quote" id="quoteCard">
    <svg class="qdeco2" viewBox="0 0 24 24"><circle cx="8" cy="16" r="5" fill="none" stroke="#1f8ea8" stroke-width="1.5"/><circle cx="17" cy="7" r="3" fill="none" stroke="#1f8ea8" stroke-width="1.5"/></svg>
    <svg class="qdeco" viewBox="0 0 48 48"><path d="M24 42L5 19Q24 -3 43 19z" fill="#f4b6a0"/><path d="M24 42L14 14M24 42V9M24 42L34 14" stroke="#fff" stroke-width="1.6" fill="none" opacity=".8"/><rect x="18" y="40" width="12" height="5" rx="2" fill="#e59a82"/></svg>
    <div class="tag">🐚 今日療癒語錄</div>
    <div class="q" id="quoteText"></div>
    <div class="row" id="quoteRow"></div>
  </div>

  <div class="sec" id="listSec">行程</div>
  <div id="list"></div>
</div>

<button class="fab" id="fab" aria-label="新增">＋</button>

<!-- 新增/編輯 -->
<div class="mask" id="maskEdit"><div class="sheet">
  <h3 id="editTitle">新增行程</h3>
  <div id="presetWrap"><label>常用待辦（選擇後帶入標題）</label><select id="fPreset"></select></div>
  <label>標題</label><input type="text" id="fTitle" placeholder="例如：晨間散步" maxlength="60">
  <label>時間區間（可留空＝全天）</label>
  <div style="display:flex;align-items:center;gap:8px"><input type="time" id="fTime"><span>～</span><input type="time" id="fEnd"></div>
  <label>日期</label><input type="date" id="fDate">
  <label>備註</label><textarea id="fNote" placeholder="想提醒自己的事…"></textarea>
  <div class="sw"><input type="checkbox" id="fRepeat"><label for="fRepeat" style="margin:0;font-size:14px;color:var(--ink)">🔁 設為固定行程（每週重複）</label></div>
  <div id="repeatDays" style="display:none"><label>重複星期</label><div class="days" id="fDays"></div></div>
  <div class="sw"><input type="checkbox" id="fSavePreset"><label for="fSavePreset" style="margin:0;font-size:14px;color:var(--ink)">⭐ 同時存成常用待辦</label></div>
  <div class="acts">
    <button class="del" id="btnDel" style="display:none">刪除</button>
    <button id="btnCancel">取消</button>
    <button class="pri" id="btnSave">儲存</button>
  </div>
</div></div>

<!-- 設定 -->
<div class="mask" id="maskSet"><div class="sheet">
  <h3>設定與備份</h3>
  <label>你的稱呼</label><input type="text" id="sName" placeholder="例如：小明" maxlength="12">

  <label>資料備份</label>
  <div class="set-row">
    <button id="btnExport">📤 匯出檔案</button>
    <button id="btnImport">📥 匯入檔案</button>
    <button id="btnCopy">📋 複製備份文字</button>
    <button id="btnPaste">📝 貼上匯入</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  <div class="hint">資料只存在這支手機的瀏覽器裡。換手機或清除瀏覽資料前，記得先匯出備份。</div>

  <label>常用待辦（新增行程時可從下拉選單選取）</label>
  <div id="presetList"></div>
  <input type="text" id="sPTitle" placeholder="新增常用待辦，例如：吃藥" maxlength="60" style="margin-top:8px">
  <div class="set-row"><button id="btnAddPreset">＋ 新增常用待辦</button></div>

  <label>每週固定行程</label>
  <div id="routineList"></div>

  <label>收藏的語錄</label>
  <div id="favList"></div>

  <div class="acts">
    <button class="del" id="btnWipe">清除全部資料</button>
    <button class="pri" id="btnSetClose">完成</button>
  </div>
</div></div>

<!-- 貼上匯入 -->
<div class="mask" id="maskPaste"><div class="sheet">
  <h3>貼上備份文字</h3>
  <textarea id="pasteBox" style="min-height:160px" placeholder="把備份文字貼在這裡"></textarea>
  <div class="acts"><button id="pasteCancel">取消</button><button class="pri" id="pasteGo">匯入</button></div>
</div></div>

<!-- 月曆 -->
<div class="mask" id="maskCal"><div class="sheet">
  <div class="cal-head"><button id="calPrev">‹</button><b id="calTitle"></b><button id="calNext">›</button></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="acts"><button id="calClose">關閉</button><button class="pri" id="calToday">回到今天</button></div>
  <div class="hint">綠點代表當天已有行程。</div>
</div></div>

<!-- 刪除固定行程 -->
<div class="mask" id="maskDel"><div class="sheet">
  <h3>刪除固定行程</h3>
  <div class="hint" id="delMsg" style="font-size:14px;margin-bottom:6px"></div>
  <div class="acts" style="flex-direction:column">
    <button class="pri" id="delOne">只刪除這一天</button>
    <button class="del" id="delAll">刪除全部（每週都不再出現）</button>

</div></div>

<div class="toast" id="toast"></div>

/* ---------- 狀態 ---------- */
let S=load();
let cur=todayKey();
let editing=null; // {id, kind:'task'|'routine'}

function blank(){return{name:"",tasks:[],routines:[],rDone:{},quotes:{},favs:[],presets:[]}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==="object")return Object.assign(blank(),r)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("儲存失敗：瀏覽器空間不足或被禁止")}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parseKey(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function shift(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 取得某日項目 ---------- */
function itemsOf(k){
  const wd=parseKey(k).getDay();
  const out=[];
  S.tasks.filter(t=>t.date===k).forEach(t=>out.push({kind:"task",id:t.id,time:t.time,end:t.end,title:t.title,note:t.note,done:!!t.done}));
  S.routines.filter(r=>r.days.includes(wd)&&!(r.skip||[]).includes(k)).forEach(r=>out.push({kind:"routine",id:r.id,time:r.time,end:r.end,title:r.title,note:r.note,done:!!S.rDone[k+"|"+r.id]}));
  out.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  return out;
}

/* ---------- 渲染 ---------- */
function render(){
  const now=new Date(), hr=now.getHours();
  const greet=hr<5?"夜深了":hr<11?"早安":hr<14?"午安":hr<18?"下午好":"晚安";
  $("hello").textContent=greet+(S.name?"，"+S.name:"")+" 🌊";
  const d=parseKey(cur);
  const isToday=cur===todayKey();
  $("dateLabel").innerHTML=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 週"+WD[d.getDay()]+"<small>"+d.getFullYear()+(isToday?" · 今天":"")+" · 點此開月曆</small>";
  $("toToday").style.display=isToday?"none":"block";

  const items=itemsOf(cur);
  const done=items.filter(i=>i.done).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  $("ringFg").style.strokeDashoffset=163.4*(1-pct/100);
  $("ringTxt").textContent=pct+"%";
  if(!items.length){$("progMain").textContent=isToday?"今天還沒有行程":"這天還沒有行程";$("progSub").textContent="點右下角 ＋ 新增"}
  else if(done===items.length){$("progMain").textContent="全部完成了 🐬";$("progSub").textContent="今天辛苦了，好好休息"}
  else{$("progMain").textContent="已完成 "+done+" / "+items.length;$("progSub").textContent="還有 "+(items.length-done)+" 件事，慢慢來"}

  $("listSec").style.display=items.length?"block":"none";
  const list=$("list");list.innerHTML="";
  if(!items.length){list.innerHTML='<div class="empty"><svg viewBox="0 0 200 120"><path d="M18 74C18 50 50 40 92 40L150 44 182 20 178 56 190 88 150 70 92 86C50 92 18 94 18 74Z" fill="#9db0dd" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M24 84C50 94 100 94 150 72" fill="none" stroke="#eaf0fb" stroke-width="6" stroke-linecap="round"/><path d="M68 43L80 26 92 41Z" fill="#9db0dd" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M96 86L116 108 124 84Z" fill="#9db0dd" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="34" cy="76" rx="9" ry="7" fill="#f4a9a0"/><g fill="#fff" opacity=".85"><circle cx="58" cy="56" r="3"/><circle cx="76" cy="66" r="2.6"/><circle cx="118" cy="56" r="3"/><circle cx="134" cy="64" r="2.6"/><circle cx="150" cy="54" r="2.4"/><circle cx="104" cy="76" r="2.6"/><circle cx="62" cy="78" r="2.2"/><circle cx="168" cy="50" r="2"/></g><ellipse cx="100" cy="42" rx="17" ry="9" fill="#fff" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 24L90 10 100 18ZM116 24L112 10 102 18Z" fill="#fff" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="101" cy="28" r="15" fill="#fff" stroke="#4a5a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="95" cy="28" r="1.8" fill="#4a5a85"/><circle cx="107" cy="28" r="1.8" fill="#4a5a85"/><ellipse cx="90" cy="33" rx="3.5" ry="2.2" fill="#f7b9b9"/><ellipse cx="112" cy="33" rx="3.5" ry="2.2" fill="#f7b9b9"/><path d="M98 33Q101 36 104 33" fill="none" stroke="#4a5a85" stroke-width="1.6" stroke-linecap="round"/><path d="M80 30l8 1M80 34l8-1M122 30l-8 1M122 34l-8-1" stroke="#4a5a85" stroke-width="1.2" stroke-linecap="round"/><circle cx="26" cy="50" r="2" fill="#bcd0f2"/><circle cx="14" cy="40" r="3" fill="none" stroke="#9db0dd" stroke-width="1.5"/></svg><br>留白也是一種安排，像鯨鯊在海裡悠悠地游</div>'}
  items.forEach(it=>{
    const el=document.createElement("div");
    el.className="item"+(it.done?" done":"");
    el.style.setProperty("--cc",it.kind==="routine"?"var(--ok)":"var(--accent)");
    el.innerHTML='<button class="chk" aria-label="完成">✓</button><div class="body"><div class="tm">'+esc(rng(it))+(it.kind==="routine"?'<span class="badge">🔁 固定行程</span>':"")+'</div><div class="tt">'+esc(it.title)+'</div>'+(it.note?'<div class="nt">'+esc(it.note)+'</div>':"")+'</div>';
    el.querySelector(".chk").onclick=e=>{e.stopPropagation();toggle(it)};
    el.querySelector(".body").onclick=()=>openEdit(it);
    list.appendChild(el);
  });
  renderQuote(false);
}
function toggle(it){
  if(it.kind==="task"){const t=S.tasks.find(x=>x.id===it.id);if(t)t.done=!t.done}
  else{const k=cur+"|"+it.id;if(S.rDone[k])delete S.rDone[k];else S.rDone[k]=true}
  save();render();
}

/* ---------- 語錄 ---------- */
function renderQuote(anim){
  const idx=S.quotes[cur];
  const t=$("quoteText"),row=$("quoteRow");
  row.innerHTML="";
  if(idx==null||!QUOTES[idx]){
    t.textContent="撿起一個貝殼，聽聽今天想對你說的話。";
    const b=document.createElement("button");b.className="pill main";b.textContent="🐚 抽語錄";b.onclick=()=>draw(false);row.appendChild(b);
  }else{
    t.textContent=QUOTES[idx];
    if(anim){t.classList.remove("draw-anim");void t.offsetWidth;t.classList.add("draw-anim")}
    const faved=S.favs.includes(QUOTES[idx]);
    const f=document.createElement("button");f.className="pill";f.textContent=faved?"💗 已收藏":"🤍 收藏";
    f.onclick=()=>{const q=QUOTES[idx];const i=S.favs.indexOf(q);if(i>=0)S.favs.splice(i,1);else S.favs.push(q);save();renderQuote(false)};
    const r=document.createElement("button");r.className="pill";r.textContent="🔄 再抽一次";r.onclick=()=>draw(true);
    const c=document.createElement("button");c.className="pill";c.textContent="📋 複製";c.onclick=()=>copyText(QUOTES[idx]).then(()=>toast("已複製"));
    row.append(f,r,c);
  }
}
function draw(again){
  let n,old=S.quotes[cur],guard=0;
  do{n=Math.floor(Math.random()*QUOTES.length);guard++}while(n===old&&guard<20);
  S.quotes[cur]=n;save();renderQuote(true);
}
function copyText(s){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s).catch(()=>fallbackCopy(s));
  return Promise.resolve(fallbackCopy(s));
}
function fallbackCopy(s){
  const ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
}

/* ---------- 編輯表單 ---------- */
let fDays=[];
function buildCats(){
  const dw=$("fDays");dw.innerHTML="";
  WD.forEach((n,i)=>{const b=document.createElement("button");b.type="button";b.textContent="週"+n;b.className=fDays.includes(i)?"on":"";b.onclick=()=>{const p=fDays.indexOf(i);if(p>=0)fDays.splice(p,1);else fDays.push(i);buildCats()};dw.appendChild(b)});
}
$("fRepeat").onchange=()=>{$("repeatDays").style.display=$("fRepeat").checked?"block":"none";$("fDate").disabled=$("fRepeat").checked};
function presetLabel(p){return p.title}
function fillPresetSelect(){
  const sel=$("fPreset");sel.innerHTML="";
  const o0=document.createElement("option");o0.value="";o0.textContent="— 選擇常用待辦 —";sel.appendChild(o0);
  S.presets.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=presetLabel(p);sel.appendChild(o)});
}
$("fPreset").onchange=()=>{
  const p=S.presets.find(x=>x.id===$("fPreset").value);if(!p)return;
  $("fTitle").value=p.title;
  $("fPreset").value="";
};
function openEdit(it){
  closeAll();
  editing=it?{id:it.id,kind:it.kind}:null;
  $("editTitle").textContent=it?"編輯行程":"新增行程";
  $("btnDel").style.display=it?"block":"none";
  let src=null;
  if(it)src=(it.kind==="task"?S.tasks:S.routines).find(x=>x.id===it.id);
  $("fTitle").value=src?src.title:"";
  $("fTime").value=src&&src.time?src.time:"";
  $("fEnd").value=src&&src.end?src.end:"";
  $("fNote").value=src&&src.note?src.note:"";
  const isR=it&&it.kind==="routine";
  fDays=isR?src.days.slice():[parseKey(cur).getDay()];
  $("fDate").value=isR?cur:(src?src.date:cur);
  $("fRepeat").checked=!!isR;
  $("fRepeat").disabled=!!it; // 編輯時不切換類型
  $("repeatDays").style.display=isR?"block":"none";
  $("fDate").disabled=!!isR;
  buildCats();
  fillPresetSelect();
  $("presetWrap").style.display=(!it&&S.presets.length)?"block":"none";
  $("fSavePreset").checked=false;
  $("maskEdit").classList.add("show");
  setTimeout(()=>{if(!it)$("fTitle").focus()},250);
}
$("btnSave").onclick=()=>{
  const title=$("fTitle").value.trim();
  if(!title){toast("請輸入標題");return}
  const time=$("fTime").value,note=$("fNote").value.trim();
  let end=$("fEnd").value;
  if(!time&&end){toast("請先選擇開始時間");return}
  if(time&&end&&end<=time){toast("結束時間需晚於開始時間");return}
  if(!time)end="";
  const rep=$("fRepeat").checked;
  if(editing){
    if(editing.kind==="task"){const t=S.tasks.find(x=>x.id===editing.id);if(t){t.title=title;t.time=time;t.end=end;t.note=note;t.date=$("fDate").value||t.date}}
    else{if(!fDays.length){toast("請選擇至少一天");return}const r=S.routines.find(x=>x.id===editing.id);if(r){r.title=title;r.time=time;r.end=end;r.note=note;r.days=fDays.slice()}}
  }else if(rep){
    if(!fDays.length){toast("請選擇至少一天");return}
    S.routines.push({id:uid(),title,time,end,note,days:fDays.slice()});
  }else{
    S.tasks.push({id:uid(),date:$("fDate").value||cur,title,time,end,note,done:false});
  }
  if($("fSavePreset").checked){
    if(!S.presets.some(p=>p.title===title))S.presets.push({id:uid(),title});
  }
  save();closeAll();render();toast("已儲存");
};
$("btnDel").onclick=async()=>{
  if(!editing)return;
  if(editing.kind==="routine"){
    const d=parseKey(cur);
    $("delMsg").textContent="這是固定行程。要只刪除 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日（週"+WD[d.getDay()]+"）這一天，還是全部刪除？";
    $("maskEdit").classList.remove("show");$("maskDel").classList.add("show");return;
  }
  if(!(await ask("確定刪除這個行程？","刪除","取消",true)))return;
  S.tasks=S.tasks.filter(x=>x.id!==editing.id);
  save();closeAll();render();
};
$("delOne").onclick=()=>{
  const r=S.routines.find(x=>x.id===editing.id);
  if(r){r.skip=r.skip||[];if(!r.skip.includes(cur))r.skip.push(cur)}
  delete S.rDone[cur+"|"+editing.id];
  save();closeAll();render();toast("已刪除這一天");
};
$("delAll").onclick=()=>{
  const id=editing.id;
  S.routines=S.routines.filter(x=>x.id!==id);
  Object.keys(S.rDone).forEach(k=>{if(k.endsWith("|"+id))delete S.rDone[k]});
  save();closeAll();render();toast("已刪除全部");
};
$("delCancel").onclick=closeAll;
$("btnCancel").onclick=closeAll;

/* ---------- 設定 ---------- */
function openSet(){
  closeAll();
  $("sName").value=S.name||"";
  renderPresets();renderRoutines();renderFavs();
  $("maskSet").classList.add("show");
}
function renderPresets(){
  const w=$("presetList");w.innerHTML="";

$("btnAddPreset").onclick=()=>{

function renderFavs(){
  const w=$("favList");w.innerHTML="";

  S.favs.forEach((q,i)=>{
    const row=document.createElement("div");row.className="fav";
    row.innerHTML="<span>💗</span><span style='flex:1'>"+esc(q)+'</span><button class="x" style="color:#d9534f">✕</button>';
    row.querySelector(".x").onclick=()=>{S.favs.splice(i,1);save();renderFavs();renderQuote(false)};
    w.appendChild(row);

$("sName").oninput=()=>{S.name=$("sName").value.trim();save();render()};
$("btnSetClose").onclick=closeAll;
$("btnSet").onclick=openSet;
$("btnWipe").onclick=async()=>{if(await ask("這會清除所有行程、固定行程、常用待辦與收藏，且無法復原。\n建議先匯出備份。確定要清除嗎？","清除全部資料","取消",true)){S=blank();save();closeAll();render();toast("已清除")}};

/* ---------- 匯出 / 匯入 ---------- */
function exportObj(){return{app:"my-daily-planner",version:1,exportedAt:new Date().toISOString(),data:S}}
function validate(o){
  if(!o||typeof o!=="object")return null;
  const d=o.data&&o.app==="my-daily-planner"?o.data:o;
  if(!Array.isArray(d.tasks)&&!Array.isArray(d.routines))return null;
  const b=blank();
  b.name=typeof d.name==="string"?d.name:"";
  b.tasks=(d.tasks||[]).filter(t=>t&&typeof t.title==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||"")).map(t=>({id:String(t.id||uid()),date:t.date,title:t.title.slice(0,60),time:/^\d{2}:\d{2}$/.test(t.time||"")?t.time:"",end:/^\d{2}:\d{2}$/.test(t.end||"")?t.end:"",note:typeof t.note==="string"?t.note:"",done:!!t.done}));
  b.routines=(d.routines||[]).filter(r=>r&&typeof r.title==="string"&&Array.isArray(r.days)).map(r=>({id:String(r.id||uid()),title:r.title.slice(0,60),time:/^\d{2}:\d{2}$/.test(r.time||"")?r.time:"",end:/^\d{2}:\d{2}$/.test(r.end||"")?r.end:"",note:typeof r.note==="string"?r.note:"",days:r.days.filter(n=>Number.isInteger(n)&&n>=0&&n<=6),skip:Array.isArray(r.skip)?r.skip.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)):[]}));
  if(d.rDone&&typeof d.rDone==="object")Object.keys(d.rDone).forEach(k=>{if(d.rDone[k])b.rDone[k]=true});
  if(d.quotes&&typeof d.quotes==="object")Object.keys(d.quotes).forEach(k=>{const n=d.quotes[k];if(Number.isInteger(n)&&n>=0&&n<QUOTES.length)b.quotes[k]=n});
  b.presets=(Array.isArray(d.presets)?d.presets:[]).filter(p=>p&&typeof p.title==="string"&&p.title).map(p=>({id:String(p.id||uid()),title:p.title.slice(0,60)}));
  b.favs=Array.isArray(d.favs)?d.favs.filter(x=>typeof x==="string"):[];
  return b;
}
async function applyImport(o){
  const b=validate(o);
  if(!b){toast("檔案格式不正確");return}
  const replace=await ask("匯入 "+b.tasks.length+" 筆行程、"+b.routines.length+" 筆固定行程。\n要覆蓋現有資料，還是與現有資料合併？","覆蓋現有資料","與現有資料合併");
  if(replace){S=b}
  else{
    const ids=new Set(S.tasks.map(t=>t.id)),rids=new Set(S.routines.map(r=>r.id));
    b.tasks.forEach(t=>{if(!ids.has(t.id))S.tasks.push(t)});
    b.routines.forEach(r=>{if(!rids.has(r.id))S.routines.push(r)});
    Object.assign(S.rDone,b.rDone);
    Object.keys(b.quotes).forEach(k=>{if(S.quotes[k]==null)S.quotes[k]=b.quotes[k]});
    b.favs.forEach(q=>{if(!S.favs.includes(q))S.favs.push(q)});
    b.presets.forEach(p=>{if(!S.presets.some(x=>x.title===p.title))S.presets.push(p)});
    if(!S.name)S.name=b.name;
  }
  save();closeAll();render();toast("匯入完成");
}
$("btnExport").onclick=async()=>{
  const text=JSON.stringify(exportObj(),null,2);
  const fname="我的日常備份_"+todayKey()+".json";
  const blob=new Blob([text],{type:"application/json"});
  try{
    const f=new File([blob],fname,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"我的日常備份"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("已匯出");
};
$("btnImport").onclick=()=>$("fileIn").click();
$("fileIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{applyImport(JSON.parse(r.result))}catch(err){toast("無法讀取：不是有效的備份檔")}};
  r.readAsText(f);e.target.value="";
};
$("btnCopy").onclick=()=>{copyText(JSON.stringify(exportObj())).then(()=>toast("備份文字已複製"))};
$("btnPaste").onclick=()=>{$("maskSet").classList.remove("show");$("pasteBox").value="";$("maskPaste").classList.add("show")};
$("pasteCancel").onclick=closeAll;
$("pasteGo").onclick=()=>{try{applyImport(JSON.parse($("pasteBox").value))}catch(e){toast("內容不是有效的備份文字")}};

/* ---------- 共用 ---------- */
function ask(msg,ok,no,danger){
  return new Promise(res=>{
    $("askMsg").textContent=msg;$("askOk").textContent=ok||"確定";$("askNo").textContent=no||"取消";
    $("askOk").className=danger?"del":"pri";
    const done=v=>{$("maskAsk").classList.remove("show");res(v)};
    $("askOk").onclick=()=>done(true);$("askNo").onclick=()=>done(false);
    $("maskAsk").classList.add("show");
  });
}
function closeAll(){["maskEdit","maskSet","maskPaste","maskCal","maskDel"].forEach(i=>$(i).classList.remove("show"))}
["maskEdit","maskSet","maskPaste","maskCal","maskDel"].forEach(i=>$(i).addEventListener("click",e=>{if(e.target.id===i)closeAll()}));
$("fab").onclick=()=>openEdit(null);
$("prev").onclick=()=>{cur=shift(cur,-1);render()};
$("next").onclick=()=>{cur=shift(cur,1);render()};
$("toToday").onclick=()=>{cur=todayKey();render()};
/* ---------- 月曆 ---------- */
let calY,calM;
function openCal(){
  closeAll();const d=parseKey(cur);calY=d.getFullYear();calM=d.getMonth();
  renderCal();$("maskCal").classList.add("show");
}
function renderCal(){
  $("calTitle").textContent=calY+" 年 "+(calM+1)+" 月";
  const g=$("calGrid");g.innerHTML="";
  WD.forEach(n=>{const e=document.createElement("div");e.className="w";e.textContent=n;g.appendChild(e)});
  const first=new Date(calY,calM,1).getDay(),days=new Date(calY,calM+1,0).getDate(),tk=todayKey();
  for(let i=0;i<first;i++)g.appendChild(document.createElement("div"));
  for(let d=1;d<=days;d++){
    const k=calY+"-"+pad(calM+1)+"-"+pad(d);
    const b=document.createElement("button");b.textContent=d;
    if(k===tk)b.classList.add("today");
    if(k===cur)b.classList.add("sel");
    if(itemsOf(k).length)b.classList.add("has");
    b.onclick=()=>{cur=k;closeAll();render()};
    g.appendChild(b);
  }
}
$("calPrev").onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
$("calNext").onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};
$("calClose").onclick=closeAll;
$("calToday").onclick=()=>{cur=todayKey();closeAll();render()};
$("dateLabel").onclick=openCal;

// 左右滑動切換日期
let sx=null,sy=null;
document.addEventListener("touchstart",e=>{if(e.target.closest(".mask"))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx==null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){cur=shift(cur,dx<0?1:-1);render()}
},{passive:true});

// 回到前景時，若日期已跨天則更新
let lastToday=todayKey();
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){const t=todayKey();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t}render()}
});

    [[58,80,4],[78,90,3.4],[104,78,4],[124,86,3.4],[142,76,3],[96,96,3.4],[62,100,3],[152,72,2.6]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2],0,7);x.fill()});
    x.fillStyle="#27425c";x.beginPath();x.arc(40,90,3.5,0,7);x.fill();
    x.strokeStyle="#27425c";x.lineWidth=3;x.beginPath();x.moveTo(26,104);x.quadraticCurveTo(38,110,54,106);x.stroke();
    const u=c.toDataURL("image/png");$("touchIcon").href=u;$("favIcon").href=u;
  }catch(e){}
})();

render();
})();
